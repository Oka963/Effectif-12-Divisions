<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12ème Division · Effectif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060608;
    --panel:rgba(18,18,24,0.72);
    --panel-solid:#101016;
    --line:rgba(255,255,255,0.08);
    --orange:#ff8a1f;
    --orange-hi:#ffb35c;
    --orange-dim:#7a4513;
    --white:#f4f4f6;
    --text:#e6e6ea;
    --dim:#8b8b99;
    --red:#ff5d5d;
    --spirit:#6fc3ff;
    --tech:#ff9a3d;
    --chem:#7be08a;
    --gold:#ffd36a;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;min-height:100vh;color:var(--text);
    font-family:'Rajdhani',sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,138,31,0.14), transparent 65%),
      radial-gradient(800px 500px at 100% 100%, rgba(111,195,255,0.07), transparent 60%),
      radial-gradient(700px 500px at 0% 80%, rgba(123,224,138,0.04), transparent 60%),
      var(--bg);
    padding:0 28px 60px;
  }
  /* reiatsu particles */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .wrap{max-width:1400px;margin:0 auto;position:relative;z-index:1;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;text-align:center;padding:54px 20px 30px;overflow:hidden;
  }
  .hero .kanji{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
    font-family:'Noto Serif JP',serif;font-weight:900;font-size:300px;line-height:1;
    color:transparent;-webkit-text-stroke:1px rgba(255,138,31,0.16);
    letter-spacing:20px;white-space:nowrap;user-select:none;pointer-events:none;
  }
  .hero .eyebrow{
    position:relative;font-family:'Cinzel',serif;font-size:12px;letter-spacing:8px;
    color:var(--orange);text-transform:uppercase;opacity:.9;
  }
  .hero h1{
    position:relative;margin:10px 0 0;
    font-family:'Cinzel Decorative',serif;font-weight:900;
    font-size:clamp(44px,8vw,92px);letter-spacing:4px;line-height:1.05;
    background:linear-gradient(180deg,#fff 10%,var(--orange-hi) 55%,var(--orange) 80%,var(--orange-dim));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 28px rgba(255,138,31,0.35));
  }
  .hero h1 sup{font-size:.42em;vertical-align:super;letter-spacing:0;margin-left:2px;}
  .divider{
    position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin:18px auto 0;max-width:520px;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--orange-dim),transparent);}
  .divider .gem{width:9px;height:9px;transform:rotate(45deg);background:var(--orange);box-shadow:0 0 14px var(--orange);}
  .hero .sub{position:relative;margin-top:14px;font-size:14px;letter-spacing:5px;color:var(--dim);text-transform:uppercase;}

  .toolbar{
    position:absolute;top:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 4px;z-index:2;
  }
  .live-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);padding:7px 14px;border-radius:30px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);animation:pulse 1.6s infinite;}
  .dot.err{background:var(--red);box-shadow:0 0 8px var(--red);}
  .dot.demo{background:var(--spirit);box-shadow:0 0 8px var(--spirit);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .refresh-btn{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,138,31,.18),rgba(255,138,31,.06));
    border:1px solid var(--orange-dim);color:var(--orange-hi);
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;
    padding:9px 18px;border-radius:30px;transition:all .2s;
  }
  .refresh-btn:hover{box-shadow:0 0 18px rgba(255,138,31,.35);transform:translateY(-1px);}
  .refresh-btn.spin svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- STATS ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:10px 0 18px;}
  .stat{
    position:relative;overflow:hidden;padding:18px 20px;border-radius:14px;
    background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);
    transition:transform .2s,border-color .2s;
  }
  .stat:hover{transform:translateY(-2px);border-color:var(--c,var(--orange-dim));}
  .stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--orange));box-shadow:0 0 14px var(--c,var(--orange));}
  .stat::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--c,var(--orange)),transparent 70%);opacity:.12;}
  .stat .num{font-family:'Cinzel',serif;font-size:34px;font-weight:700;color:var(--c,var(--orange));line-height:1;}
  .stat .label{margin-top:8px;font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;}

  /* ---------- SYNC ---------- */
  .sync-bar{display:flex;align-items:center;gap:16px;margin-bottom:18px;font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
  .sync-bar b{color:var(--orange);font-weight:600;}
  .sync-track{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
  .sync-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange-dim),var(--orange-hi));transition:width .3s linear;}

  /* ---------- CONTROLS ---------- */
  .controls{
    padding:16px;border-radius:14px;background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid var(--line);margin-bottom:10px;display:flex;flex-direction:column;gap:12px;
  }
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5;}
  .search{
    width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);
    padding:13px 16px 13px 46px;border-radius:10px;font-family:'Rajdhani';font-size:16px;letter-spacing:1px;transition:all .2s;
  }
  .search::placeholder{color:var(--dim);}
  .search:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,138,31,.12);}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .filter-row .lbl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:var(--orange);text-transform:uppercase;min-width:70px;opacity:.85;}
  .filter-btn{
    background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--dim);
    padding:7px 14px;border-radius:30px;font-family:'Rajdhani';font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;white-space:nowrap;transition:all .15s;
  }
  .filter-btn:hover{color:var(--text);border-color:var(--orange-dim);}
  .filter-btn.active{background:linear-gradient(180deg,rgba(255,138,31,.25),rgba(255,138,31,.08));border-color:var(--orange);color:var(--orange-hi);box-shadow:0 0 14px rgba(255,138,31,.2);}

  /* ---------- TABLE ---------- */
  table{width:100%;border-collapse:separate;border-spacing:0 7px;}
  thead th{text-align:left;font-size:10px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;padding:8px 16px;font-weight:600;}
  .grade-row td{padding:22px 6px 4px;}
  .grade-head{display:flex;align-items:center;gap:12px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--tier,var(--orange));}
  .grade-head::before{content:'';width:8px;height:8px;transform:rotate(45deg);background:var(--tier,var(--orange));box-shadow:0 0 10px var(--tier,var(--orange));}
  .grade-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--tier,var(--orange-dim)),transparent);opacity:.55;}
  .grade-head .count{order:3;font-family:'Rajdhani';letter-spacing:1px;color:var(--dim);font-size:13px;background:rgba(255,255,255,.04);padding:2px 10px;border-radius:20px;}

  tr.member td{
    background:var(--panel);backdrop-filter:blur(8px);
    padding:13px 16px;font-size:15px;vertical-align:middle;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .2s;
  }
  tr.member td:first-child{border-left:3px solid var(--tier,var(--orange));border-radius:12px 0 0 12px;}
  tr.member td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0;}
  tr.member:hover td{background:rgba(255,138,31,.07);}
  tr.member.is-absent td{opacity:.62;}

  .idx{color:var(--dim);width:48px;font-family:'Cinzel',serif;font-size:13px;}
  .person{display:flex;align-items:center;gap:14px;}
  .avatar{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:14px;color:var(--tier,var(--orange));
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.12),rgba(0,0,0,.4));
    border:1.5px solid var(--tier,var(--orange));box-shadow:0 0 14px -2px var(--tier,var(--orange));
  }
  .badge,.brig,.role-chip{white-space:nowrap;}
  .nom{white-space:nowrap;font-weight:700;color:#fff;letter-spacing:.5px;font-size:16px;}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:30px;font-size:12px;font-weight:600;letter-spacing:.6px;border:1px solid;}
  .badge.grade{color:var(--tier,var(--orange));border-color:color-mix(in srgb,var(--tier,var(--orange)) 45%,transparent);background:color-mix(in srgb,var(--tier,var(--orange)) 10%,transparent);}
  .badge.lame{color:var(--spirit);border-color:rgba(111,195,255,.4);background:rgba(111,195,255,.08);}
  .brig{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:30px;letter-spacing:.8px;border:1px solid;}
  .brig i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}
  .brig.spirituel{color:var(--spirit);border-color:rgba(111,195,255,.4);background:rgba(111,195,255,.08);}
  .brig.technique{color:var(--tech);border-color:rgba(255,154,61,.4);background:rgba(255,154,61,.08);}
  .brig.chimie{color:var(--chem);border-color:rgba(123,224,138,.4);background:rgba(123,224,138,.08);}
  .brig.formateur{color:#c79bff;border-color:rgba(199,155,255,.4);background:rgba(199,155,255,.08);}
  .brig.tresorerie{color:var(--gold);border-color:rgba(255,211,106,.4);background:rgba(255,211,106,.08);}
  .brig.alchimiste{color:#ff7eb6;border-color:rgba(255,126,182,.4);background:rgba(255,126,182,.08);}
  .brig.autre{color:var(--dim);border-color:var(--line);}
  .role-badges{display:flex;flex-wrap:wrap;gap:6px;}
  .role-chip{font-size:12px;font-weight:700;padding:4px 11px;border-radius:30px;letter-spacing:.6px;color:var(--gold);border:1px solid rgba(255,211,106,.4);background:rgba(255,211,106,.08);}
  .fonction{font-size:13px;color:var(--text);opacity:.85;letter-spacing:.3px;line-height:1.35;display:inline-block;max-width:340px;}
  .flag-yes{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:700;font-size:12px;letter-spacing:1px;}
  .flag-yes::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
  .flag-dim{color:var(--dim);opacity:.4;}
  .sanction-none{color:var(--dim);opacity:.45;font-size:13px;}
  .sanction-badge{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,93,93,.4);background:rgba(255,93,93,.1);color:#ff9a9a;padding:5px 12px;border-radius:30px;font-size:12px;font-weight:700;letter-spacing:.5px;}
  .sanction-badge .warn-dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse 1.4s infinite;}
  .empty-state{text-align:center;padding:70px 20px;color:var(--dim);font-family:'Cinzel',serif;letter-spacing:3px;}
  .error-state{text-align:center;padding:40px 20px;color:var(--red);font-size:14px;letter-spacing:1px;line-height:1.7;}

  tr.member{animation:rise .45s both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  @media (max-width:800px){
    body{padding:0 14px 40px;}
    .hero .kanji{font-size:160px;}
    thead{display:none;}
    .toolbar{position:static;margin-bottom:12px;}
    .idx{display:none;}
    td{padding:10px !important;}
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

  <header class="hero">
    <div class="toolbar">
      <span class="live-pill"><span class="dot" id="liveDot"></span><span id="liveLabel">Actif</span></span>
      <button class="refresh-btn" id="refreshBtn" onclick="loadData(true)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        Actualiser
      </button>
    </div>
    <div class="kanji">十二</div>
    <div class="eyebrow">Gotei 13 · Soul Society</div>
    <h1>12<sup>ème</sup> Division</h1>
    <div class="divider"><span class="gem"></span></div>
    <div class="sub">Effectif officiel des Shinigami</div>
  </header>

  <section class="stats">
    <div class="stat"><div class="num" id="sMembres">–</div><div class="label">Membres</div></div>
    <div class="stat" style="--c:var(--spirit)"><div class="num" id="sSpirit">–</div><div class="label">Corps Spirituel</div></div>
    <div class="stat" style="--c:var(--tech)"><div class="num" id="sTech">–</div><div class="label">Corps Technique</div></div>
    <div class="stat" style="--c:var(--chem)"><div class="num" id="sChem">–</div><div class="label">Pôle Chimie</div></div>
    <div class="stat" style="--c:#c79bff"><div class="num" id="sForm">–</div><div class="label">Pôle Formateur</div></div>
    <div class="stat" style="--c:var(--gold)"><div class="num" id="sTres">–</div><div class="label">Pôle Trésorerie</div></div>
    <div class="stat" style="--c:#ff7eb6"><div class="num" id="sAlch">–</div><div class="label">Pôle Alchimiste</div></div>
    <div class="stat" style="--c:var(--red)"><div class="num" id="sAbs">–</div><div class="label">Absents</div></div>
  </section>

  <div class="sync-bar">
    <span>Sync <b id="syncTime">--:--:--</b></span>
    <div class="sync-track"><div class="sync-fill" id="syncFill"></div></div>
    <span>Auto-sync <b id="syncCountdown">30s</b></span>
  </div>

  <section class="controls">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input class="search" id="searchBox" placeholder="Rechercher un shinigami…">
    </div>
    <div class="filter-row"><span class="lbl">Grade</span><div id="filterGrades" style="display:flex;gap:8px;flex-wrap:wrap;"></div></div>
    <div class="filter-row"><span class="lbl">Corps</span><div id="filterCorps" style="display:flex;gap:8px;flex-wrap:wrap;"></div></div>
    <div class="filter-row"><span class="lbl">Pôle</span><div id="filterPoles" style="display:flex;gap:8px;flex-wrap:wrap;"></div></div>
    <div class="filter-row"><span class="lbl">Rôle</span><div id="filterRoles" style="display:flex;gap:8px;flex-wrap:wrap;"></div></div>
  </section>

  <div id="tableHolder"><div class="empty-state">Chargement de l'effectif…</div></div>
</div>

<script>
// ⚙️ COLLE ICI LE LIEN DE TON GOOGLE SHEET (le lien complet, tel quel, entre les guillemets)
// Partage du Sheet : « Tous les utilisateurs disposant du lien : Lecteur »
// Tant que le lien n'est pas collé, des données de démonstration s'affichent.
const SHEET_LINK = "https://docs.google.com/spreadsheets/d/1o5MUTvPfSHBgjwgc0VqiVbG4V5Z8DNSKn8ioICjC174/edit?gid=538137158#gid=538137158";

const _m = SHEET_LINK.match(/\/d\/([a-zA-Z0-9-_]+)/);
const _g = SHEET_LINK.match(/[#&?]gid=(\d+)/);
const SHEET_ID = _m ? _m[1] : "REMPLACE_PAR_TON_ID_DE_SHEET";
const GID = _g ? _g[1] : "0";

// Colonnes attendues : Grade | Nom | Brigade | Zanpakuto | Absent | Sanction
const HEADER_MATCH = { grade:"grade", nom:"nom", brigade:"brigade", corps:"corps", pole:"pole", lame:"zanpakuto", absent:"absent", sanction:"sanction", kenpachi:"kenpachi", tresorerie:"tresorerie", formateur:"formateur", alchimie:"alchimi", fonction:"fonction", spirituel:"spirituel", technique:"technique", chimie:"chimie" };
const ROLES = [["kenpachi","Kenpachi"]];

const GRADES = [
  ["capitaine","Capitaine","#ffd36a"],["fukutaicho","Fukutaicho","#ffb35c"],
  ["3siege","3ème siège","#ffa23a"],["4siege","4ème siège","#ff9a2e"],["5siege","5ème siège","#ff8a1f"],["6siege","6ème siège","#ff8a1f"],
  ["junshikan1classe","Junshikan 1er classe","#ff6b6b"],["junshikan2classe","Junshikan 2nd classe","#f0708f"],["junshikan3classe","Junshikan 3e classe","#e374a3"],["junshikan4classe","Junshikan 4e classe","#d77ab8"],
  ["kashikan1classe","Kashikan 1er classe","#a58ce0"],["kashikan2classe","Kashikan 2nd classe","#7f9cf0"],
  ["shinigami1","Shinigami 1er","#6fc3ff"],["shinigami2","Shinigami 2nd","#6fd8d0"],["shinigami3","Shinigami 3ème","#9aa6b8"]
];
// Deux catégories distinctes : le CORPS (Spirituel / Technique) et le PÔLE (Chimie, …)
const CORPS = ["Spirituel","Technique"];
const POLES = ["Chimie","Formateur","Trésorerie","Alchimiste"];
// Colonnes cochables du Sheet (clé d'en-tête, libellé) lues pour Corps/Pôle
const GROUP_COLS = [["spirituel","Spirituel"],["technique","Technique"],["chimie","Chimie"],["formateur","Formateur"],["tresorerie","Trésorerie"],["alchimie","Alchimiste"]];

const DEMO = [
  ["Capitaine","Kuchiki Ren","Spirituel","Senbonzakura","",""],
  ["Fukutaicho","Aizen Mitsuki","Technique","Kyoka","",""],
  ["5ème siège","Hayate Sora","Spirituel","Kazehana","FALSE",""],
  ["6ème siège","Mori Kaito","Chimie","Tsuyuhime","","Avertissement"],
  ["Junshikan 1er classe","Yamada Rei","Chimie","","",""],
  ["Junshikan 2nd classe","Tachibana Jin","Technique","Hishigata","TRUE",""],
  ["Junshikan 4e classe","Sakurai Mio","Spirituel","","",""],
  ["Kashikan 1er classe","Ito Daichi","Technique","","",""],
  ["Kashikan 2nd classe","Nakamura Aya","Chimie","","",""],
  ["Shinigami 1er","Kurosaki Ryu","Spirituel","Getsuga","",""],
  ["Shinigami 2nd","Abe Hiro","","","",""],
  ["Shinigami 3ème","Okada Shun","Technique","","TRUE","Suspension"]
];

let allMembers = [], activeGrade = "Tous", activeCorps = "Tous", activePole = "Tous", activeRole = "Tous", countdownTimer = null;

function normKey(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
    .replace(/[^a-z0-9]/g,"").replace(/(\d)(eme|er|nd|e)/g,"$1");
}
function cleanHeader(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z]/g,"").toLowerCase(); }
function gradeInfo(g){
  const k = normKey(g);
  const i = GRADES.findIndex(([key]) => key === k);
  return i === -1 ? { idx:999, label:g || "Non classé", color:"#8b8b99" } : { idx:i, label:GRADES[i][1], color:GRADES[i][2] };
}
function brigClass(b){ const k = normKey(b); return ["spirituel","technique","chimie","formateur","tresorerie","alchimiste"].includes(k) ? k : "autre"; }
function isTrue(v){ if(!v) return false; return ["TRUE","VRAI","OUI","X","1","✓"].includes(v.toString().trim().toUpperCase()); }
function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function initials(n){ const p = n.trim().split(/\s+/); return ((p[0]||"")[0]||"").toUpperCase() + ((p[1]||"")[0]||"").toUpperCase(); }

function parseCSV(text){
  const rows = []; let row = [], field = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(q){ if(c === '"' && n === '"'){ field += '"'; i++; } else if(c === '"') q = false; else field += c; }
    else {
      if(c === '"') q = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\r'){}
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function detectColumns(rows){
  for(let r = 0; r < Math.min(rows.length, 15); r++){
    const cleaned = rows[r].map(cleanHeader);
    if(cleaned.includes("grade") && cleaned.includes("nom")){
      const col = {}, used = new Set();
      Object.entries(HEADER_MATCH).forEach(([key, m]) => { col[key] = cleaned.findIndex(c => c === m); if(col[key] >= 0) used.add(col[key]); });
      Object.entries(HEADER_MATCH).forEach(([key, m]) => { if(col[key] < 0){ col[key] = cleaned.findIndex((c,i) => !used.has(i) && c.includes(m)); if(col[key] >= 0) used.add(col[key]); } });
      return { headerRow:r, col };
    }
  }
  return null;
}

// Lit Corps et Pôle séparément.
// Colonnes "Corps" et "Pôle" si elles existent ; sinon on retombe sur l'ancienne colonne
// "Brigade" / les cases Spirituel-Technique-Chimie et on trie chaque valeur dans la bonne catégorie.
function readGroups(get, COL){
  const corps = new Set(), poles = new Set();
  const canon = (x, list) => list.find(b => normKey(b) === (normKey(x) === "alchimie" ? "alchimiste" : normKey(x)));
  const split = s => s.split(/[,;\/+&]|\bet\b/i).map(x => x.trim()).filter(Boolean);
  const sort = (x, fallback) => {
    const c = canon(x, CORPS), p = canon(x, POLES);
    if(c) corps.add(c); else if(p) poles.add(p);
    else (fallback === "corps" ? corps : poles).add(x);
  };
  GROUP_COLS.forEach(([k,b]) => { const i = COL[k]; if(i >= 0 && isTrue(get(i))) sort(b); });
  split(get(COL.brigade)).forEach(x => sort(x, "pole"));
  split(get(COL.corps)).forEach(x => sort(x, "corps"));
  split(get(COL.pole)).forEach(x => sort(x, "pole"));
  const ordered = (set, list) => [...list.filter(b => set.has(b)), ...[...set].filter(b => !list.includes(b))];
  return { corps: ordered(corps, CORPS), poles: ordered(poles, POLES) };
}

function buildMembers(rows, headerRow, COL){
  const members = [];
  for(let r = headerRow + 1; r < rows.length; r++){
    const row = rows[r]; if(!row) continue;
    const get = i => i >= 0 ? (row[i]||"").trim() : "";
    const nom = get(COL.nom); if(!nom) continue;
    const gi = gradeInfo(get(COL.grade));
    const grp = readGroups(get, COL);
    members.push({ grade:gi.label, gIdx:gi.idx, color:gi.color, nom, corps:grp.corps, poles:grp.poles, lame:get(COL.lame), sanction:get(COL.sanction), absent:isTrue(get(COL.absent)), fonction:get(COL.fonction), roles:ROLES.filter(([k]) => isTrue(get(COL[k]))).map(([,l]) => l) });
  }
  members.sort((a,b) => a.gIdx - b.gIdx);
  return members;
}

function hasSanction(m){ const s = (m.sanction||"").trim().toUpperCase(); return s && s !== "FALSE" && s !== "FAUX"; }

async function loadData(manual){
  const dot = document.getElementById("liveDot"), label = document.getElementById("liveLabel"), btn = document.getElementById("refreshBtn");
  if(manual) btn.classList.add("spin");
  try{
    let rows;
    if(SHEET_ID.startsWith("REMPLACE")){
      rows = [["Grade","Nom","Brigade","Zanpakuto","Absent","Sanction"], ...DEMO];
      dot.className = "dot"; label.textContent = "Actif";
    } else {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&t=${Date.now()}`;
      const res = await fetch(url, {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP " + res.status);
      rows = parseCSV(await res.text());
      dot.className = "dot"; label.textContent = "Actif";
    }
    const det = detectColumns(rows);
    if(!det) throw new Error("En-têtes introuvables (colonnes Grade/Nom)");
    allMembers = buildMembers(rows, det.headerRow, det.col);

    buildFilters(); render();
    const cntC = b => allMembers.filter(m => m.corps.some(x => normKey(x) === b)).length;
    const cntP = b => allMembers.filter(m => m.poles.some(x => normKey(x) === b)).length;
    document.getElementById("sMembres").textContent = allMembers.length;
    document.getElementById("sSpirit").textContent = cntC("spirituel");
    document.getElementById("sTech").textContent = cntC("technique");
    document.getElementById("sChem").textContent = cntP("chimie");
    document.getElementById("sForm").textContent = cntP("formateur");
    document.getElementById("sTres").textContent = cntP("tresorerie");
    document.getElementById("sAlch").textContent = cntP("alchimiste");
    document.getElementById("sAbs").textContent = allMembers.filter(m => m.absent).length;
    document.getElementById("syncTime").textContent = new Date().toLocaleTimeString('fr-FR');
    restartCountdown();
  } catch(err){
    dot.className = "dot err"; label.textContent = "Erreur de synchronisation";
    document.getElementById("tableHolder").innerHTML =
      `<div class="error-state">Impossible de lire la feuille Google Sheets.<br>Vérifie que le partage est réglé sur « Tous les utilisateurs disposant du lien : Lecteur ».<br>(${escapeHtml(err.message)})</div>`;
  } finally {
    if(manual) setTimeout(() => btn.classList.remove("spin"), 500);
  }
}

function makeBtns(holderId, values, active, onPick){
  const holder = document.getElementById(holderId); holder.innerHTML = "";
  values.forEach(v => {
    const b = document.createElement("button");
    b.className = "filter-btn" + (v === active ? " active" : "");
    b.textContent = v; b.onclick = () => onPick(v); holder.appendChild(b);
  });
}
function buildFilters(){
  const present = [...new Set(allMembers.map(m => m.grade))].sort((a,b) => gradeInfo(a).idx - gradeInfo(b).idx);
  makeBtns("filterGrades", ["Tous", ...present], activeGrade, g => { activeGrade = g; buildFilters(); render(); });
  const poles = [...POLES, ...new Set(allMembers.flatMap(m => m.poles).filter(p => !POLES.includes(p)))];
  const corps = [...CORPS, ...new Set(allMembers.flatMap(m => m.corps).filter(c => !CORPS.includes(c)))];
  makeBtns("filterCorps", ["Tous", ...corps], activeCorps, c => { activeCorps = c; buildFilters(); render(); });
  makeBtns("filterPoles", ["Tous", ...poles], activePole, p => { activePole = p; buildFilters(); render(); });
  makeBtns("filterRoles", ["Tous", ...ROLES.map(r => r[1])], activeRole, r => { activeRole = r; buildFilters(); render(); });
}

function render(){
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  let list = allMembers.filter(m => m.nom.toLowerCase().includes(q));
  if(activeGrade !== "Tous") list = list.filter(m => m.grade === activeGrade);
  if(activeCorps !== "Tous") list = list.filter(m => m.corps.some(x => normKey(x) === normKey(activeCorps)));
  if(activePole !== "Tous") list = list.filter(m => m.poles.some(x => normKey(x) === normKey(activePole)));
  if(activeRole !== "Tous") list = list.filter(m => m.roles.includes(activeRole));
  if(!list.length){ document.getElementById("tableHolder").innerHTML = `<div class="empty-state">Aucun membre trouvé</div>`; return; }

  let html = `<table><thead><tr><th></th><th>Shinigami</th><th>Grade</th><th>Corps</th><th>Pôle</th><th>Zanpakuto</th><th>Rôles</th><th>Fonction</th><th>Absent</th><th>Sanction</th></tr></thead><tbody>`;
  let last = null, idx = 0;
  list.forEach(m => {
    if(m.grade !== last){
      const count = list.filter(x => x.grade === m.grade).length;
      html += `<tr class="grade-row" style="--tier:${m.color}"><td colspan="10"><div class="grade-head">${escapeHtml(m.grade)}<span class="count">${count}</span></div></td></tr>`;
      last = m.grade;
    }
    idx++;
    const sVal = (m.sanction||"").trim();
    const sanction = hasSanction(m)
      ? `<span class="sanction-badge"><span class="warn-dot"></span>${escapeHtml(isTrue(sVal) ? "Sanctionné" : sVal)}</span>`
      : `<span class="sanction-none">Aucune</span>`;
    const chips = arr => arr.length ? `<div class="role-badges">${arr.map(b => `<span class="brig ${brigClass(b)}"><i></i>${escapeHtml(b)}</span>`).join("")}</div>` : `<span class="flag-dim">—</span>`;
    const corpsHtml = chips(m.corps), poleHtml = chips(m.poles);
    html += `<tr class="member${m.absent ? ' is-absent' : ''}" style="--tier:${m.color};animation-delay:${Math.min(idx*30,600)}ms">
      <td class="idx">${String(idx).padStart(2,'0')}</td>
      <td><div class="person"><div class="avatar">${escapeHtml(initials(m.nom))}</div><span class="nom">${escapeHtml(m.nom)}</span></div></td>
      <td><span class="badge grade">${escapeHtml(m.grade)}</span></td>
      <td>${corpsHtml}</td>
      <td>${poleHtml}</td>
      <td>${m.lame ? `<span class="badge lame">⚔ ${escapeHtml(m.lame)}</span>` : `<span class="flag-dim">—</span>`}</td>
      <td>${m.roles.length ? `<div class="role-badges">${m.roles.map(r => `<span class="role-chip">${escapeHtml(r)}</span>`).join("")}</div>` : `<span class="flag-dim">—</span>`}</td>
      <td>${m.fonction ? `<span class="fonction">${escapeHtml(m.fonction)}</span>` : `<span class="flag-dim">—</span>`}</td>
      <td>${m.absent ? `<span class="flag-yes">Absent</span>` : `<span class="flag-dim">–</span>`}</td>
      <td>${sanction}</td>
    </tr>`;
  });
  document.getElementById("tableHolder").innerHTML = html + `</tbody></table>`;
}

function restartCountdown(){
  clearInterval(countdownTimer);
  let t = 30;
  document.getElementById("syncCountdown").textContent = t + "s";
  document.getElementById("syncFill").style.width = "0%";
  countdownTimer = setInterval(() => {
    t--;
    document.getElementById("syncCountdown").textContent = Math.max(t,0) + "s";
    document.getElementById("syncFill").style.width = ((30-t)/30*100) + "%";
    if(t <= 0){ clearInterval(countdownTimer); loadData(false); }
  }, 1000);
}
document.getElementById("searchBox").addEventListener("input", render);

/* ---------- reiatsu particles ---------- */
(function(){
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  let W, H, P = [];
  function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", size); size();
  const make = () => ({ x:Math.random()*W, y:H+Math.random()*40, r:Math.random()*1.8+.4, v:Math.random()*.5+.15, d:Math.random()*Math.PI*2, a:Math.random()*.5+.2, h:Math.random()<.8 ? 28 : 205 });
  for(let i=0;i<70;i++){ const p = make(); p.y = Math.random()*H; P.push(p); }
  function tick(){
    ctx.clearRect(0,0,W,H);
    P.forEach((p,i) => {
      p.y -= p.v; p.d += .01; p.x += Math.sin(p.d)*.35;
      if(p.y < -10){ P[i] = make(); return; }
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,`hsla(${p.h},100%,65%,${p.a})`); g.addColorStop(1,`hsla(${p.h},100%,60%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*5,0,7); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

loadData(false);
